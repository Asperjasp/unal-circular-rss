# ============================================
# Azure App Service Configuration
# For deployment via Azure CLI or GitHub Actions
# ============================================

# Application settings
name: health-scraper
runtime: python:3.11
entrypoint: gunicorn main:app -w 4 -k uvicorn.workers.UvicornWorker -b 0.0.0.0:8000

# Build configuration
build:
  commands:
    - pip install -r requirements.txt

# Environment variables (set these in Azure Portal or CLI)
env:
  DATABASE_URL: "sqlite:///./data/health_institutions.db"
  # For production, use Azure PostgreSQL:
  # DATABASE_URL: "postgresql://user:pass@yourserver.postgres.database.azure.com:5432/healthdb?sslmode=require"

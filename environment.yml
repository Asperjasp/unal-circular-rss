# ============================================
# Health Institutions Scraper - Conda Environment
# ============================================
# 
# To create the environment:
#   conda env create -f environment.yml
#
# To activate the environment:
#   conda activate health-scraper
#
# To update the environment:
#   conda env update -f environment.yml --prune
#
# To remove the environment:
#   conda env remove -n health-scraper
#
# NOTE: This environment.yml mirrors requirements.txt
#       Both pip and conda users will have the same dependencies
# ============================================

name: health-scraper
channels:
  - conda-forge
  - defaults

dependencies:
  - python=3.11
  - pip
  
  # Install all packages via pip for consistency with requirements.txt
  - pip:
    # Web Framework
    - fastapi>=0.104.1
    - uvicorn>=0.24.0
    
    # Web Scraping
    - beautifulsoup4>=4.12.2
    - selenium>=4.15.2
    - requests>=2.31.0
    - lxml>=4.9.3
    - webdriver-manager>=4.0.1
    
    # Data Validation
    - pydantic>=2.7.0
    
    # Database (SQLAlchemy for persistence)
    - sqlalchemy>=2.0.23
    
    # Environment & Configuration
    - python-dotenv>=1.0.0
    
    # Data Processing
    - pandas>=2.1.3
    - openpyxl>=3.1.2
    
    # Async Support
    - aiofiles>=23.2.1
    - httpx>=0.28.0
    
    # AI / Vision
    - google-genai>=1.0.0
    - Pillow>=10.0.0
    
    # File Upload & Frontend
    - python-multipart>=0.0.6
    - jinja2>=3.1.2

# ============================================
# GitHub Actions - Azure Container Apps Deployment
# ============================================
# 
# Setup:
# 1. Create Azure Service Principal:
#    az ad sp create-for-rbac --name "github-health-scraper" --role contributor \
#        --scopes /subscriptions/{subscription-id}/resourceGroups/{resource-group} \
#        --sdk-auth
#
# 2. Add the JSON output as a GitHub secret named AZURE_CREDENTIALS
#
# 3. Add these secrets to GitHub:
#    - AZURE_CREDENTIALS: Service principal JSON
#    - REGISTRY_LOGIN_SERVER: yourregistry.azurecr.io
#    - REGISTRY_USERNAME: ACR username
#    - REGISTRY_PASSWORD: ACR password
# ============================================

name: Deploy to Azure Container Apps

on:
  push:
    branches: [main, master]
  workflow_dispatch:

env:
  AZURE_CONTAINER_REGISTRY: ${{ secrets.REGISTRY_LOGIN_SERVER }}
  CONTAINER_NAME: health-scraper
  RESOURCE_GROUP: health-scraper-rg
  CONTAINER_APP_NAME: health-scraper-app
  CONTAINER_APP_ENV: health-scraper-env

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Log in to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.AZURE_CONTAINER_REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build and push container image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.AZURE_CONTAINER_REGISTRY }}/${{ env.CONTAINER_NAME }}:${{ github.sha }}
            ${{ env.AZURE_CONTAINER_REGISTRY }}/${{ env.CONTAINER_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to Azure Container Apps
        uses: azure/container-apps-deploy-action@v1
        with:
          resourceGroup: ${{ env.RESOURCE_GROUP }}
          containerAppName: ${{ env.CONTAINER_APP_NAME }}
          containerAppEnvironment: ${{ env.CONTAINER_APP_ENV }}
          imageToDeploy: ${{ env.AZURE_CONTAINER_REGISTRY }}/${{ env.CONTAINER_NAME }}:${{ github.sha }}
          targetPort: 8000

      - name: Get application URL
        run: |
          APP_URL=$(az containerapp show \
            --name ${{ env.CONTAINER_APP_NAME }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --query properties.configuration.ingress.fqdn \
            -o tsv)
          echo "🚀 Application deployed to: https://$APP_URL"
          echo "📚 API Documentation: https://$APP_URL/docs"
